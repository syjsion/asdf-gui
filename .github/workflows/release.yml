name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'publish/v*'

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version and signing mode
        env:
          P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          SIGN_IDENTITY_SECRET: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_IDENTITY }}
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            RELEASE_TAG="${GITHUB_REF_NAME#publish/}"
          fi

          VERSION="${RELEASE_TAG#v}"
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags/branches must resolve to vMAJOR.MINOR.PATCH." >&2
            exit 64
          fi

          if [[ "$(uname -m)" != "${{ matrix.arch }}" ]]; then
            echo "Runner architecture mismatch: expected ${{ matrix.arch }}, got $(uname -m)" >&2
            exit 65
          fi

          values=(P12_BASE64 P12_PASSWORD SIGN_IDENTITY_SECRET NOTARY_KEY_BASE64 NOTARY_KEY_ID NOTARY_ISSUER_ID)
          configured=0
          for value in "${values[@]}"; do
            if [[ -n "${!value}" ]]; then
              configured=$((configured + 1))
            fi
          done

          if [[ "$configured" -eq 0 ]]; then
            RELEASE_SIGNING_MODE="adhoc"
            SIGN_IDENTITY="-"
            echo "No Apple signing credentials configured. Building an ad-hoc signed prerelease."
          elif [[ "$configured" -eq "${#values[@]}" ]]; then
            RELEASE_SIGNING_MODE="developer-id"
            SIGN_IDENTITY="$SIGN_IDENTITY_SECRET"
            echo "All Apple signing credentials configured. Building a Developer ID notarized release."
          else
            echo "Apple release credentials are partially configured ($configured/${#values[@]})." >&2
            echo "Configure all six documented secrets or remove them all to use ad-hoc mode." >&2
            exit 78
          fi

          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_SIGNING_MODE=$RELEASE_SIGNING_MODE" >> "$GITHUB_ENV"
          echo "SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          if [[ "$RELEASE_SIGNING_MODE" != "developer-id" ]]; then
            echo "Skipping Developer ID import in ad-hoc mode."
            exit 0
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/asdf-gui-build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          export CERTIFICATE_PATH P12_BASE64
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          Path(os.environ["CERTIFICATE_PATH"]).write_bytes(base64.b64decode(os.environ["P12_BASE64"]))
          PY
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Prepare App Store Connect notarization key
        env:
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          if [[ "$RELEASE_SIGNING_MODE" != "developer-id" ]]; then
            echo "Skipping notarization key setup in ad-hoc mode."
            exit 0
          fi

          APPLE_NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          export APPLE_NOTARY_KEY_PATH NOTARY_KEY_BASE64
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          Path(os.environ["APPLE_NOTARY_KEY_PATH"]).write_bytes(base64.b64decode(os.environ["NOTARY_KEY_BASE64"]))
          PY
          chmod 600 "$APPLE_NOTARY_KEY_PATH"
          echo "APPLE_NOTARY_KEY_PATH=$APPLE_NOTARY_KEY_PATH" >> "$GITHUB_ENV"
          echo "APPLE_NOTARY_KEY_ID=$APPLE_NOTARY_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_NOTARY_ISSUER_ID=$APPLE_NOTARY_ISSUER_ID" >> "$GITHUB_ENV"

      - name: Build app
        env:
          OUTPUT_DIR: ${{ github.workspace }}/dist
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/build-app.sh

      - name: Notarize and staple app when Developer ID is available
        run: |
          if [[ "$RELEASE_SIGNING_MODE" != "developer-id" ]]; then
            echo "Skipping notarization in ad-hoc mode."
            exit 0
          fi

          APP_PATH="dist/asdf GUI.app"
          APP_ZIP="$RUNNER_TEMP/asdf-gui-app.zip"
          ditto -c -k --keepParent "$APP_PATH" "$APP_ZIP"
          bash scripts/notarize.sh "$APP_ZIP" "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"

      - name: Create DMG
        run: |
          DMG_PATH="dist/asdf-gui-${VERSION}-macos-${{ matrix.arch }}-${RELEASE_SIGNING_MODE}.dmg"
          bash scripts/create-dmg.sh "dist/asdf GUI.app" "$DMG_PATH"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      - name: Verify DMG and optionally notarize
        run: |
          if [[ "$RELEASE_SIGNING_MODE" == "developer-id" ]]; then
            bash scripts/notarize.sh "$DMG_PATH" "$DMG_PATH"
          fi

          bash scripts/verify-package.sh "dist/asdf GUI.app" "$DMG_PATH"

          if [[ "$RELEASE_SIGNING_MODE" == "developer-id" ]]; then
            spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG_PATH"
          else
            echo "Ad-hoc package verified. Gatekeeper trust is intentionally not expected without Developer ID/notarization."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: asdf-gui-${{ matrix.arch }}-${{ env.RELEASE_SIGNING_MODE }}
          path: ${{ env.DMG_PATH }}
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: asdf-gui-*
          path: dist
          merge-multiple: true

      - name: Resolve release tag
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            RELEASE_TAG="${GITHUB_REF_NAME#publish/}"
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Generate checksums and release notes
        run: |
          cd dist
          sha256sum *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

          if compgen -G '*-adhoc.dmg' > /dev/null; then
            cat > RELEASE_NOTES.md <<'EOF'
          ## Ad-hoc macOS build

          This prerelease is built without an Apple Developer ID certificate or notarization because the project currently does not have Apple Developer Program credentials.

          The app bundle is ad-hoc signed so its bundle integrity can be verified, but macOS Gatekeeper will not treat it as a trusted notarized app. On first launch, use **Control-click / right-click the app → Open → Open** to explicitly approve it.

          Two DMGs are provided:
          - `arm64` for Apple Silicon Macs
          - `x86_64` for Intel Macs

          Verify your download with `SHA256SUMS.txt` if desired.
          EOF
          else
            cat > RELEASE_NOTES.md <<'EOF'
          ## Notarized macOS build

          This release is signed with Developer ID, notarized by Apple, and distributed as architecture-specific DMGs for Apple Silicon and Intel Macs.

          Verify your download with `SHA256SUMS.txt` if desired.
          EOF
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(
            release create "$RELEASE_TAG"
            dist/*.dmg
            dist/SHA256SUMS.txt
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --notes-file dist/RELEASE_NOTES.md
            --title "asdf GUI $RELEASE_TAG"
          )

          if compgen -G 'dist/*-adhoc.dmg' > /dev/null; then
            args+=(--prerelease)
          fi

          gh "${args[@]}"
