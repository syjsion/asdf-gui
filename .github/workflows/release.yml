name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag and release secrets
        env:
          P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_IDENTITY }}
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH." >&2
            exit 64
          fi
          for value in P12_BASE64 P12_PASSWORD SIGN_IDENTITY NOTARY_KEY_BASE64 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            if [[ -z "${!value}" ]]; then
              echo "Required release secret is missing: $value" >&2
              exit 78
            fi
          done
          if [[ "$(uname -m)" != "${{ matrix.arch }}" ]]; then
            echo "Runner architecture mismatch: expected ${{ matrix.arch }}, got $(uname -m)" >&2
            exit 65
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/asdf-gui-build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          export CERTIFICATE_PATH P12_BASE64
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          Path(os.environ["CERTIFICATE_PATH"]).write_bytes(base64.b64decode(os.environ["P12_BASE64"]))
          PY
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Prepare App Store Connect notarization key
        env:
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          APPLE_NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          export APPLE_NOTARY_KEY_PATH NOTARY_KEY_BASE64
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          Path(os.environ["APPLE_NOTARY_KEY_PATH"]).write_bytes(base64.b64decode(os.environ["NOTARY_KEY_BASE64"]))
          PY
          chmod 600 "$APPLE_NOTARY_KEY_PATH"
          echo "APPLE_NOTARY_KEY_PATH=$APPLE_NOTARY_KEY_PATH" >> "$GITHUB_ENV"
          echo "APPLE_NOTARY_KEY_ID=$APPLE_NOTARY_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_NOTARY_ISSUER_ID=$APPLE_NOTARY_ISSUER_ID" >> "$GITHUB_ENV"

      - name: Build and sign app
        env:
          OUTPUT_DIR: ${{ github.workspace }}/dist
          BUILD_NUMBER: ${{ github.run_number }}
          SIGN_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_IDENTITY }}
        run: bash scripts/build-app.sh

      - name: Notarize and staple app
        run: |
          APP_PATH="dist/asdf GUI.app"
          APP_ZIP="$RUNNER_TEMP/asdf-gui-app.zip"
          ditto -c -k --keepParent "$APP_PATH" "$APP_ZIP"
          bash scripts/notarize.sh "$APP_ZIP" "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"

      - name: Create and sign DMG
        env:
          SIGN_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_IDENTITY }}
        run: |
          DMG_PATH="dist/asdf-gui-${VERSION}-macos-${{ matrix.arch }}.dmg"
          bash scripts/create-dmg.sh "dist/asdf GUI.app" "$DMG_PATH"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      - name: Notarize, staple, and verify DMG
        run: |
          bash scripts/notarize.sh "$DMG_PATH" "$DMG_PATH"
          bash scripts/verify-package.sh "dist/asdf GUI.app" "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG_PATH"

      - uses: actions/upload-artifact@v4
        with:
          name: asdf-gui-${{ matrix.arch }}
          path: ${{ env.DMG_PATH }}
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: asdf-gui-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.dmg \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "asdf GUI $GITHUB_REF_NAME"
